name: Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate pairing API URL
        env:
          SOTIRIA_PAIRING_API_BASE_URL: ${{ vars.SOTIRIA_PAIRING_API_BASE_URL }}
        run: |
          if [ -z "$SOTIRIA_PAIRING_API_BASE_URL" ]; then
            echo "::error::SOTIRIA_PAIRING_API_BASE_URL is missing or empty"
            exit 1
          fi
          if [ "$SOTIRIA_PAIRING_API_BASE_URL" != "https://sotiria.ap12app12.workers.dev" ]; then
            echo "::error::SOTIRIA_PAIRING_API_BASE_URL must be exactly https://sotiria.ap12app12.workers.dev"
            exit 1
          fi

      - name: Build debug APK
        working-directory: android-companion
        env:
          SOTIRIA_PAIRING_API_BASE_URL: ${{ vars.SOTIRIA_PAIRING_API_BASE_URL }}
        run: |
          chmod +x gradlew
          ./gradlew "-PsotiriaPairingApiBaseUrl=$SOTIRIA_PAIRING_API_BASE_URL" :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sotiria-android-debug-apk
          path: android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
